[package]
name = "drzreplaywin"
version = "2.0.0"
edition = "2021"
description = "Instant replay for Windows: always recording into memory, Alt+Z saves the last minute"
license = "MIT"
publish = false

[[bin]]
name = "DrzReplayWIN"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ab_glyph = "0.2"
shared_child = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
resvg = { version = "0.45", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
winreg = "0.55"
wasapi = "0.27"
clipboard-win = "5"
trash = "5"
rfd = { version = "0.15", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
] }

[target.'cfg(unix)'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
